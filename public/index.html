<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心动时刻 - 全动态真人互动影像游戏</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        brand: {
          purple: '#7c3aed',
          'purple-dark': '#6d28d9',
          pink: '#e040fb',
          pink2: '#ec4899',
          pink3: '#ff6b9d',
          cyan: '#06b6d4'
        },
        surface: {
          darkest: '#0a0a14',
          dark: '#0f0f1a',
          card: '#1a1a2e',
          login: '#140a28',
          overlay: '#141428'
        },
        border: {
          dim: '#2a2a4a',
          accent: '#3a2060'
        },
        text: {
          dim: '#888',
          dimmer: '#666',
          dimmest: '#555',
          muted: '#aaa',
          subtle: '#ccc'
        }
      }
    }
  }
}
</script>
<style type="text/tailwindcss">
/* ===== 基础 ===== */
* { margin:0; padding:0; box-sizing:border-box; }
@font-face { font-family:'Game'; src:local('Microsoft YaHei'),local('PingFang SC'),local('sans-serif'); }

/* ===== 页面系统 ===== */
.page { @apply hidden absolute inset-0; }
.page.active { @apply flex; }

/* ===== 登录页 ===== */
#loginPage {
  @apply flex-col items-center justify-center;
  background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a14 70%);
}
.login-container {
  @apply bg-surface-login/90 border border-border-accent rounded-[20px] py-12 px-10 w-[420px] text-center;
  backdrop-filter: blur(10px);
}
.login-container h1 {
  @apply text-[32px] mb-1;
  background: linear-gradient(135deg, #ff6b9d, #7c3aed, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.login-container .sub { @apply text-text-dim text-[13px] mb-7; }
.login-container .field { @apply mb-4 text-left; }
.login-container label { @apply block text-[13px] text-text-muted mb-[5px]; }
.login-container input {
  @apply w-full py-3 px-4 bg-black/50 border border-border-dim rounded-[10px] text-white text-[14px] outline-none;
  transition: border .2s;
}
.login-container input:focus { @apply border-brand-purple; }
.login-container .btn {
  @apply w-full py-3 text-white border-none rounded-[10px] text-[15px] cursor-pointer mt-3;
  background: linear-gradient(135deg, #7c3aed, #e040fb);
  transition: all .2s;
}
.login-container .btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(124,58,237,0.4);
}
.login-container .btn.sec { @apply bg-white/10 mt-2; }
.login-container .err { @apply text-red-500 text-[13px] mt-2 min-h-[20px]; }
.login-container .switch { @apply text-text-dim text-[13px] mt-4 cursor-pointer; }
.login-container .switch span { @apply text-brand-purple; }

/* ===== 大厅页 ===== */
#lobbyPage {
  @apply flex-col items-center justify-center;
  background: linear-gradient(135deg, #0a0a14 0%, #1a0a2e 40%, #0a1a2e 100%);
}
.lobby-bg {
  @apply absolute inset-0 opacity-[0.08];
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><radialGradient id="g"><stop offset="0" stop-color="%23fff"/><stop offset="1" stop-color="%23000"/></radialGradient></defs><circle cx="400" cy="300" r="300" fill="url(%23g)" opacity="0.3"/></svg>') center/cover;
}
.lobby-content { @apply relative z-[1] text-center; }
.lobby-content h1 {
  @apply text-[48px] mb-2;
  background: linear-gradient(135deg, #ff6b9d, #7c3aed, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: none;
}
.lobby-content .ver { @apply text-[12px] text-text-dimmest mb-10; }
.menu-btns { @apply flex flex-col gap-[14px] w-[280px] mx-auto; }
.menu-btn {
  @apply py-[14px] px-0 bg-white/5 border border-white/10 rounded-[12px] text-text-subtle text-[16px] cursor-pointer relative overflow-hidden;
  transition: all .3s;
}
.menu-btn:hover {
  @apply bg-brand-purple/15 border-brand-purple/40 text-white;
  transform: scale(1.03);
}
.menu-btn .icon { @apply mr-2; }
.user-bar { @apply absolute top-5 right-6 flex items-center gap-[10px] text-text-dim text-[13px] z-[2]; }
.user-bar .logout { @apply text-text-dimmest cursor-pointer; transition: color .2s; }
.user-bar .logout:hover { @apply text-red-500; }

/* ===== 游戏播放器 ===== */
#gamePage { @apply flex-col bg-black relative; }
#gameVideo { @apply w-full h-full object-contain bg-black relative z-0; }

/* 跳过按钮 */
.skip-btn {
  @apply absolute bottom-[100px] right-6 z-[90] bg-white/10 border border-white/20 text-text-subtle py-2 px-5 rounded-[20px] text-[14px] cursor-pointer hidden;
  transition: all .2s;
}
.skip-btn.show { @apply block; }
.skip-btn:hover { @apply bg-white/20 text-white; }

/* 语言选择栏 */
.lang-bar { @apply absolute top-[60px] right-4 z-[90] hidden flex-col gap-1; }
.lang-bar.show { @apply flex; }
.lang-bar select,
.lang-bar label {
  @apply bg-black/60 border border-white/15 rounded-md text-text-subtle py-1 px-2 text-[12px] cursor-pointer;
}
.lang-bar label { @apply flex items-center gap-1 cursor-pointer; }
.lang-bar input[type=checkbox] { accent-color: #7c3aed; }

/* 选择覆盖层 */
.choice-overlay {
  @apply absolute bottom-0 left-0 right-0 pt-[30px] px-10 pb-[50px] hidden z-[100];
  background: linear-gradient(transparent, rgba(0,0,0,0.85) 40%);
}
.choice-overlay.active { @apply block; }
.choice-timer { @apply text-center mb-4; }
.choice-timer .timer-bar { @apply h-[3px] bg-white/10 rounded-sm overflow-hidden w-[300px] mx-auto; }
.choice-timer .timer-fill {
  @apply h-full;
  background: linear-gradient(90deg, #7c3aed, #e040fb);
  transition: width .1s linear;
  width: var(--w, 100%);
}
.choice-timer .timer-text { @apply text-text-dim text-[12px] mt-[6px]; }
.choices { @apply flex gap-4 justify-center flex-wrap; }
.choice-btn {
  @apply flex-1 min-w-[160px] max-w-[280px] py-4 px-6 bg-surface-login/85 border border-brand-purple/30 rounded-[14px] text-[#ddd] text-[15px] cursor-pointer text-center relative overflow-hidden;
  backdrop-filter: blur(8px);
  transition: all .25s;
}
.choice-btn:hover {
  @apply bg-brand-purple/25 border-brand-purple text-white;
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(124,58,237,0.25);
}
.choice-btn .hint { @apply text-[11px] text-text-dim mt-[6px] flex gap-[6px] justify-center; }

/* 好感度面板 */
.aff-panel { @apply absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-2 z-[5] opacity-0; transition: opacity .5s; }
.aff-panel.show { @apply opacity-100; }
.aff-item { @apply flex items-center gap-[6px] bg-black/60 py-[6px] px-[10px] rounded-[20px] border border-white/[0.08]; }
.aff-dot { @apply w-2 h-2 rounded-full; }
.aff-name { @apply text-[11px] text-text-muted w-10 text-right; }
.aff-bar-wrap { @apply w-20 h-1 bg-white/10 rounded-sm overflow-hidden; }
.aff-bar { @apply h-full rounded-sm; transition: width .5s ease; width: var(--w, 50%); }
.aff-val { @apply text-[10px] text-text-dimmer w-6; }

/* 好感度变化动画 */
.aff-change { @apply fixed text-[20px] font-bold pointer-events-none z-[20]; animation: affFloat 1.5s ease-out forwards; }
@keyframes affFloat { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-60px); } }
.aff-change.up { @apply text-brand-pink2; text-shadow: 0 0 10px rgba(236,72,153,0.5); }
.aff-change.down { @apply text-brand-cyan; text-shadow: 0 0 10px rgba(6,182,212,0.5); }

/* 场景标题 */
.scene-title { @apply absolute top-5 left-6 z-[5] text-[14px] text-white/50; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

/* 暂停菜单 */
.pause-menu { @apply absolute top-[10px] left-[10px] z-[15]; }
.pause-btn {
  @apply bg-black/50 border-none text-white text-[20px] w-9 h-9 rounded-full cursor-pointer flex items-center justify-center;
  transition: background .2s;
}
.pause-btn:hover { @apply bg-black/80; }
.pause-dropdown {
  @apply hidden absolute top-11 left-0 bg-surface-login/95 border border-border-accent rounded-[12px] p-2 min-w-[160px];
}
.pause-dropdown.show { @apply block; }
.pause-dropdown button {
  @apply block w-full py-[10px] px-4 bg-transparent border-none text-text-subtle text-left text-[14px] cursor-pointer rounded-lg;
  transition: background .2s;
}
.pause-dropdown button:hover { @apply bg-brand-purple/20 text-white; }

/* ===== 存档页面 ===== */
#saveLoadPage { @apply flex-col items-center justify-center bg-black/[0.92] z-[30]; }
.save-panel { @apply bg-surface-login/95 border border-border-accent rounded-[20px] p-8 w-[560px] max-w-[90vw]; }
.save-panel h2 { @apply text-center mb-5 text-[22px]; }
.save-slots { @apply grid grid-cols-3 gap-3 mb-5; }
.save-slot {
  @apply bg-black/40 border border-border-dim rounded-[12px] p-4 cursor-pointer text-center min-h-[100px] flex flex-col justify-center;
  transition: all .2s;
}
.save-slot:hover { @apply border-brand-purple; }
.save-slot .slot-num { @apply text-[11px] text-text-dimmer; }
.save-slot .slot-title { @apply text-[13px] text-text-subtle mt-1; }
.save-slot .slot-time { @apply text-[10px] text-text-dimmest; }
.save-slot.empty { @apply text-[#444] text-[13px]; }
.save-panel .actions { @apply flex gap-[10px] justify-center; }

/* ===== 通用按钮 ===== */
.btn { @apply inline-flex items-center gap-[6px] py-[10px] px-6 border-none rounded-[10px] text-[14px] cursor-pointer; transition: all .2s; }
.btn-purple { @apply bg-brand-purple text-white; }
.btn-purple:hover { @apply bg-brand-purple-dark; }
.btn-outline { @apply bg-transparent border border-border-dim text-text-muted; }
.btn-outline:hover { @apply text-white border-brand-purple; }

/* ===== 结局画面 ===== */
#endingPage {
  @apply items-center justify-center flex-col z-[30];
  background: radial-gradient(ellipse at center, #1a0a2e 0%, #0a0a14 70%);
}
.ending-card { @apply text-center max-w-[500px]; }
.ending-card .type { @apply text-[13px] tracking-[4px] mb-2; }
.ending-card h2 { @apply text-[36px] mb-3; }
.ending-card .desc { @apply text-text-dim text-[15px] mb-[30px] leading-relaxed; }
.ending-card .type.perfect { @apply text-[#ffd700]; }
.ending-card .type.good { @apply text-brand-purple; }
.ending-card .type.normal { @apply text-text-dim; }
.ending-card .type.bad { @apply text-text-dimmer; }

/* ===== 图鉴 ===== */
#galleryPage { @apply flex-col items-center bg-black/[0.92] overflow-y-auto py-10 px-5 z-[20]; }
.gallery-grid { @apply grid grid-cols-[repeat(auto-fill,minmax(200px,1fr))] gap-4 max-w-[900px] w-full; }
.gallery-item {
  @apply bg-surface-login/80 border border-border-dim rounded-[14px] p-5 text-center;
  transition: all .2s;
}
.gallery-item.unlocked { @apply border-brand-purple; }
.gallery-item.locked { @apply opacity-30; }
.gallery-item h4 { @apply text-[15px] mb-1; }
.gallery-item .gtype { @apply text-[11px] text-text-dim; }
.gallery-back { @apply fixed top-5 left-6 text-text-dim cursor-pointer text-[14px] z-[21]; }

/* ===== Toast ===== */
.toast {
  @apply fixed top-6 left-1/2 -translate-x-1/2 py-[10px] px-6 bg-brand-purple/90 rounded-[20px] text-[14px] z-[100];
  animation: toastIn .3s ease, toastOut .3s ease 2s forwards;
}
@keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; } }
</style>
</head>
<body class="font-['Game',sans-serif] bg-black text-white overflow-hidden select-none h-screen w-screen">

<!-- ==================== 登录页 ==================== -->
<div id="loginPage" class="page active">
  <div class="login-container">
    <h1>心动时刻</h1>
    <div class="sub">全动态真人互动影像游戏</div>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="field hidden" id="nicknameField"><label>昵称</label><input id="loginNick" placeholder="请输入昵称"></div>
    <div id="loginErr" class="err"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <button class="btn sec hidden" id="registerBtn" onclick="doRegister()">注 册</button>
    <div class="switch">还没有账号？<span id="switchBtn" onclick="toggleAuth()">立即注册</span></div>
  </div>
</div>

<!-- ==================== 大厅页 ==================== -->
<div id="lobbyPage" class="page">
  <div class="lobby-bg"></div>
  <div class="user-bar"><span id="lobbyUser"></span><span class="logout" onclick="logout()">退出</span></div>
  <div class="lobby-content">
    <h1>心动时刻</h1>
    <div class="ver">Heartbeat Moments v1.0</div>
    <div class="menu-btns">
      <button class="menu-btn" onclick="startNewGame()"><span class="icon">▶</span> 开始新游戏</button>
      <button class="menu-btn" onclick="showSaveLoad('load')"><span class="icon">📂</span> 继续游戏</button>
      <button class="menu-btn" onclick="showGallery()"><span class="icon">🏆</span> 结局图鉴</button>
      <button class="menu-btn" onclick="logout()"><span class="icon">🚪</span> 退出登录</button>
    </div>
  </div>
</div>

<!-- ==================== 游戏播放器 ==================== -->
<div id="gamePage" class="page">
  <video id="gameVideo" playsinline preload="auto"></video>
  <div class="scene-title" id="sceneTitle"></div>
  <div class="pause-menu">
    <button class="pause-btn" onclick="togglePause()">⏸</button>
    <div class="pause-dropdown" id="pauseDropdown">
      <button onclick="showSaveLoad('save')">💾 存档</button>
      <button onclick="showSaveLoad('load')">📂 读档</button>
      <button onclick="returnToLobby()">🏠 返回大厅</button>
    </div>
  </div>
  <div class="choice-overlay" id="choiceOverlay">
    <div class="choice-timer" id="choiceTimer">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="timer-text" id="timerText"></div>
    </div>
    <div class="choices" id="choicesContainer"></div>
  </div>
  <div class="aff-panel" id="affPanel"></div>
  <button class="skip-btn" id="skipBtn" onclick="skipToChoices()">跳过 ⏭</button>
  <div class="lang-bar" id="langBar">
    <select id="audioSelect" onchange="switchAudio()" class="hidden"></select>
    <label id="subToggle" class="hidden"><input type="checkbox" id="subCheck" onchange="toggleSubtitles()"> 字幕</label>
    <select id="subSelect" onchange="switchSubtitle()" class="hidden"></select>
  </div>
</div>

<!-- ==================== 存档面板 ==================== -->
<div id="saveLoadPage" class="page">
  <div class="save-panel" id="savePanel"></div>
</div>

<!-- ==================== 结局页 ==================== -->
<div id="endingPage" class="page"></div>

<!-- ==================== 图鉴页 ==================== -->
<div id="galleryPage" class="page">
  <div class="gallery-back" onclick="returnToLobby()">← 返回大厅</div>
  <h2 class="mb-6">结局图鉴</h2>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<script>
// ========== 全局状态 ==========
const API = '';
let token = localStorage.getItem('plot_game_token');
let user = null;
let gameState = {
  currentScene: null,
  currentVideo: null,
  affections: {},
  characters: [],
  choiceTimer: null,
  timerInterval: null,
  isEnding: false
};

// ========== 工具函数 ==========
function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(API + path, { ...opts, headers: { ...headers, ...opts.headers } })
    .then(r => r.json());
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ========== 页面切换 ==========
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => { p.classList.remove('active', 'flex'); p.classList.add('hidden'); });
  const page = document.getElementById(id);
  if (page) { page.classList.add('active', 'flex'); page.classList.remove('hidden'); }
  // 暂停视频
  const v = document.getElementById('gameVideo');
  if (id !== 'gamePage' && v) v.pause();
}

// ========== 登录/注册 ==========
let isRegister = false;
function toggleAuth() {
  isRegister = !isRegister;
  const nicknameField = document.getElementById('nicknameField');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  if (isRegister) {
    nicknameField.classList.remove('hidden');
    loginBtn.classList.add('hidden');
    registerBtn.classList.remove('hidden');
  } else {
    nicknameField.classList.add('hidden');
    loginBtn.classList.remove('hidden');
    registerBtn.classList.add('hidden');
  }
  document.getElementById('switchBtn').textContent = isRegister ? '返回登录' : '立即注册';
  document.getElementById('loginErr').textContent = '';
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) return document.getElementById('loginErr').textContent = '请输入用户名和密码';
  const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
  if (res.error) return document.getElementById('loginErr').textContent = res.error;
  token = res.token; user = res.user;
  localStorage.setItem('plot_game_token', token);
  document.getElementById('lobbyUser').textContent = user.nickname || user.username;
  showPage('lobbyPage');
}

async function doRegister() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const n = document.getElementById('loginNick').value.trim();
  if (!u || !p) return document.getElementById('loginErr').textContent = '请输入用户名和密码';
  if (p.length < 6) return document.getElementById('loginErr').textContent = '密码至少6位';
  const res = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ username: u, password: p, nickname: n || u }) });
  if (res.error) return document.getElementById('loginErr').textContent = res.error;
  token = res.token; user = res.user;
  localStorage.setItem('plot_game_token', token);
  document.getElementById('lobbyUser').textContent = user.nickname || user.username;
  showPage('lobbyPage');
}

function logout() {
  token = null; user = null; gameState = {};
  localStorage.removeItem('plot_game_token');
  showPage('loginPage');
  document.getElementById('loginErr').textContent = '';
  const v = document.getElementById('gameVideo'); v.pause(); v.src = '';
}

// ========== 新游戏 ==========
async function startNewGame() {
  const res = await api('/api/play/start');
  if (res.error) return toast(res.error);
  gameState.affections = {};
  loadScene(res.scene);
}

async function loadScene(scene) {
  // 清除上一个场景的定时器
  if (gameState._choiceDelayId) { clearTimeout(gameState._choiceDelayId); gameState._choiceDelayId = null; }
  hideChoices();
  clearInterval(gameState.timerInterval);

  gameState.currentScene = scene;
  gameState.isEnding = scene.is_ending && scene.ending;
  if (scene.characters) gameState.characters = scene.characters;

  showPage('gamePage');
  document.getElementById('sceneTitle').textContent = scene.chapter ? scene.chapter + ' - ' + scene.title : scene.title;

  // 播放视频
  const v = document.getElementById('gameVideo');
  v.currentTime = 0;
  v.src = '/' + (scene.file_path || '').replace(/\\/g, '/');
  v.load();
  v.play().catch(() => {});

  // 好感度面板
  renderAffectionPanel();

  // 语言/音轨/字幕
  initLanguageBar(scene);

  // 根据 choice_delay 决定何时弹出选项
  const delay = scene.choice_delay || 0; // 秒
  const hasChoices = scene.choices && scene.choices.length > 0;

  if (hasChoices) {
    if (delay > 0) {
      // 显示跳过按钮
      document.getElementById('skipBtn').classList.add('show');
      // 延迟弹出：视频播到第N秒时暂停并显示选项
      gameState._choiceDelayId = setTimeout(() => {
        document.getElementById('skipBtn').classList.remove('show');
        v.pause();
        renderChoices(scene.choices, (scene.choice_timer == null || scene.choice_timer === 0) ? 0 : (scene.choice_timer || 10));
      }, delay * 1000);
    } else {
      document.getElementById('skipBtn').classList.remove('show');
      // 等视频播完再显示选项
      v.onended = () => {
        if (!gameState.isEnding) {
          renderChoices(scene.choices, (scene.choice_timer == null || scene.choice_timer === 0) ? 0 : (scene.choice_timer || 10));
        }
      };
    }
  } else {
    hideChoices();
    document.getElementById('skipBtn').classList.remove('show');
  }

  // 结局处理
  if (gameState.isEnding) {
    setTimeout(() => showEnding(scene.ending), 2000);
  }
}

// ========== 选择系统 ==========
function skipToChoices() {
  if (gameState._choiceDelayId) {
    clearTimeout(gameState._choiceDelayId);
    gameState._choiceDelayId = null;
  }
  document.getElementById('skipBtn').classList.remove('show');
  const v = document.getElementById('gameVideo');
  v.pause();
  const scene = gameState.currentScene;
  if (scene && scene.choices) {
    renderChoices(scene.choices, (scene.choice_timer == null || scene.choice_timer === 0) ? 0 : (scene.choice_timer || 10));
  }
}

function renderChoices(choices, defaultTimer) {
  const overlay = document.getElementById('choiceOverlay');
  const container = document.getElementById('choicesContainer');
  container.innerHTML = '';

  const useTimer = defaultTimer > 0;
  const choiceTimer = document.getElementById('choiceTimer');
  if (useTimer) {
    choiceTimer.classList.remove('hidden');
    document.getElementById('timerFill').style.setProperty('--w', '100%');
    document.getElementById('timerText').textContent = defaultTimer + 's';
    startChoiceTimer(defaultTimer);
  } else {
    choiceTimer.classList.add('hidden');
  }

  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    if (c.affection_hint && c.affection_hint.length > 0) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      c.affection_hint.forEach(h => {
        const dot = document.createElement('span');
        dot.textContent = h.direction === 'up' ? '❤️' : h.direction === 'down' ? '💔' : '';
        hint.appendChild(dot);
      });
      btn.appendChild(hint);
    }
    btn.onclick = () => makeChoice(c.id);
    container.appendChild(btn);
  });

  overlay.classList.add('active');
}

function hideChoices() {
  document.getElementById('choiceOverlay').classList.remove('active');
  clearInterval(gameState.timerInterval);
}

function startChoiceTimer(seconds) {
  clearInterval(gameState.timerInterval);
  let remaining = seconds;
  gameState.timerInterval = setInterval(() => {
    remaining -= 0.1;
    const pct = Math.max(0, (remaining / seconds) * 100);
    document.getElementById('timerFill').style.setProperty('--w', pct + '%');
    document.getElementById('timerText').textContent = Math.ceil(remaining) + 's';
    if (remaining <= 0) {
      clearInterval(gameState.timerInterval);
      // 自动选第一个
      const firstBtn = document.querySelector('.choice-btn');
      if (firstBtn) firstBtn.click();
    }
  }, 100);
}

async function makeChoice(choiceId) {
  hideChoices();
  clearInterval(gameState.timerInterval);
  if (gameState._choiceDelayId) { clearTimeout(gameState._choiceDelayId); gameState._choiceDelayId = null; }

  const res = await api('/api/play/choose', {
    method: 'POST',
    body: JSON.stringify({ choice_id: choiceId, scene_id: gameState.currentScene.id, affections: gameState.affections })
  });
  if (res.error) return toast(res.error);

  // 好感度变化动画
  gameState.affections = res.affections || {};
  if (res.affection_changes) {
    res.affection_changes.forEach(ch => {
      showAffectionChange(ch);
    });
  }

  // 跳转到下一场景
  if (res.next_scene_id) {
    const sceneRes = await api('/api/play/scene/' + res.next_scene_id + '?affections=' + encodeURIComponent(JSON.stringify(gameState.affections)));
    if (sceneRes.scene) loadScene(sceneRes.scene);
    else toast('场景加载失败');
  } else {
    // 没有下一场景 = 结局
    toast('故事完结');
    setTimeout(() => returnToLobby(), 3000);
  }
}

function showAffectionChange(change) {
  const el = document.createElement('div');
  el.className = 'aff-change ' + (change.delta > 0 ? 'up' : 'down');
  el.textContent = (change.delta > 0 ? '+' : '') + change.delta + ' ' + change.character_name;
  el.style.left = (40 + Math.random() * 40) + '%';
  el.style.top = (30 + Math.random() * 20) + '%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

// ========== 语言/音轨/字幕 ==========
let currentAudioEl = null;

function initLanguageBar(scene) {
  const langBar = document.getElementById('langBar');
  const audioSel = document.getElementById('audioSelect');
  const subToggle = document.getElementById('subToggle');
  const subSel = document.getElementById('subSelect');
  const subCheck = document.getElementById('subCheck');

  const audios = scene.audios || [];
  if (audios.length > 0) {
    audioSel.classList.remove('hidden');
    audioSel.innerHTML = audios.map((a, i) => 
      '<option value="' + i + '" ' + (a.is_default ? 'selected' : '') + '>🎤 ' + a.label + '</option>'
    ).join('');
    const defaultIdx = audios.findIndex(a => a.is_default);
    applyAudio(audios[defaultIdx >= 0 ? defaultIdx : 0]);
  } else { audioSel.classList.add('hidden'); stopAltAudio(); }

  const subs = scene.subtitles || [];
  if (subs.length > 0) {
    subToggle.classList.remove('hidden');
    subSel.classList.remove('hidden');
    subSel.innerHTML = subs.map((s, i) =>
      '<option value="' + i + '" ' + (s.is_default ? 'selected' : '') + '>📝 ' + s.label + '</option>'
    ).join('');
    loadSubtitleTracks(subs);
    subCheck.checked = true;
    toggleSubtitles();
  } else { subToggle.classList.add('hidden'); subSel.classList.add('hidden'); clearSubtitleTracks(); }

  langBar.classList.toggle('show', audios.length > 0 || subs.length > 0);
}

function applyAudio(audio) {
  stopAltAudio();
  if (!audio) return;
  const v = document.getElementById('gameVideo');
  const a = document.createElement('audio');
  a.src = '/' + (audio.file_path || '').replace(/\\/g, '/');
  a.load();
  v.muted = true;
  v.onplay = () => { a.currentTime = v.currentTime; a.play().catch(()=>{}); };
  v.onpause = () => a.pause();
  v.onseeked = () => { a.currentTime = v.currentTime; };
  a.play().catch(() => {});
  currentAudioEl = a;
}

function stopAltAudio() {
  if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl.remove(); currentAudioEl = null; }
  document.getElementById('gameVideo').muted = false;
}

function switchAudio() {
  const idx = parseInt(document.getElementById('audioSelect').value);
  const audios = gameState.currentScene?.audios || [];
  if (audios[idx]) applyAudio(audios[idx]);
}

function loadSubtitleTracks(subs) {
  clearSubtitleTracks();
  const v = document.getElementById('gameVideo');
  subs.forEach(s => {
    const track = document.createElement('track');
    track.kind = 'subtitles'; track.label = s.label; track.srclang = s.language;
    track.src = '/' + (s.file_path || '').replace(/\\/g, '/');
    track.id = 'track-' + s.id;
    v.appendChild(track);
  });
}

function clearSubtitleTracks() {
  document.getElementById('gameVideo').querySelectorAll('track').forEach(t => t.remove());
}

function toggleSubtitles() {
  const v = document.getElementById('gameVideo');
  const checked = document.getElementById('subCheck').checked;
  for (let i = 0; i < v.textTracks.length; i++) {
    v.textTracks[i].mode = checked ? 'showing' : 'hidden';
  }
}

function switchSubtitle() {
  const v = document.getElementById('gameVideo');
  const idx = parseInt(document.getElementById('subSelect').value);
  for (let i = 0; i < v.textTracks.length; i++) {
    v.textTracks[i].mode = (i === idx && document.getElementById('subCheck').checked) ? 'showing' : 'hidden';
  }
}

function renderAffectionPanel() {
  const panel = document.getElementById('affPanel');
  panel.innerHTML = '';
  if (!gameState.characters) return;

  gameState.characters.forEach(c => {
    const val = gameState.affections[c.id] || 0;
    const pct = Math.min(100, Math.max(0, 50 + val * 0.5));
    const item = document.createElement('div');
    item.className = 'aff-item';
    item.innerHTML = `
      <div class="aff-dot" style="background:${c.color}"></div>
      <span class="aff-name">${c.name}</span>
      <div class="aff-bar-wrap"><div class="aff-bar" style="--w:${pct}%;background:${c.color}"></div></div>
      <span class="aff-val">${val > 0 ? '+' + val : val}</span>
    `;
    panel.appendChild(item);
  });
  panel.classList.add('show');
}

// ========== 暂停菜单 ==========
function togglePause() {
  document.getElementById('pauseDropdown').classList.toggle('show');
}

// ========== 存档/读档 ==========
let saveMode = 'save';
let saveCallback = null;

async function showSaveLoad(mode) {
  saveMode = mode;
  const panel = document.getElementById('savePanel');
  const res = await api('/api/saves');
  const saves = res.saves || [];

  let html = '<h2>' + (mode === 'save' ? '💾 保存游戏' : '📂 读取存档') + '</h2><div class="save-slots">';
  for (let i = 1; i <= 9; i++) {
    const s = saves.find(sv => sv.slot === i);
    html += `<div class="save-slot ${s ? '' : 'empty'}" data-slot="${i}" onclick="${mode === 'save' ? 'doSave('+i+')' : (s ? 'doLoad('+s.id+')' : '')}">
      <div class="slot-num">存档位 ${i}</div>
      ${s ? `<div class="slot-title">${s.title}</div><div class="slot-time">${s.scene_title||''} · ${new Date(s.updated_at).toLocaleString()}</div>` : '<span>空</span>'}
    </div>`;
  }
  html += '</div><div class="actions"><button class="btn btn-outline" onclick="showPage(\'gamePage\')">返回</button></div>';
  panel.innerHTML = html;
  showPage('saveLoadPage');
}

async function doSave(slot) {
  if (!gameState.currentScene) return toast('没有进行中的游戏');
  const res = await api('/api/saves', {
    method: 'POST',
    body: JSON.stringify({
      slot,
      scene_id: gameState.currentScene.id,
      title: gameState.currentScene.title,
      play_time: 0,
      affections: gameState.affections
    })
  });
  if (res.error) return toast(res.error);
  toast('存档成功！');
  showPage('gamePage');
}

async function doLoad(saveId) {
  const res = await api('/api/saves/' + saveId + '/load');
  if (res.error) return toast(res.error);
  const save = res.save;

  // 恢复好感度
  gameState.affections = {};
  if (save.affections) {
    save.affections.forEach(a => { gameState.affections[a.character_id] = a.value; });
  }

  // 加载场景
  const sceneRes = await api('/api/play/scene/' + save.scene_id + '?affections=' + encodeURIComponent(JSON.stringify(gameState.affections)));
  if (sceneRes.scene) {
    loadScene(sceneRes.scene);
    toast('读档成功！');
  } else {
    toast('场景加载失败');
  }
}

// ========== 结局画面 ==========
function showEnding(ending) {
  const page = document.getElementById('endingPage');
  page.innerHTML = `
    <div class="ending-card">
      <div class="type ${ending.type}">${ending.type === 'perfect' ? '★ PERFECT ENDING' : ending.type === 'good' ? 'GOOD ENDING' : ending.type === 'bad' ? 'BAD ENDING' : 'ENDING'}</div>
      <h2>${ending.title}</h2>
      <div class="desc">${ending.description || ''}</div>
      <button class="btn btn-purple" onclick="returnToLobby()">返回大厅</button>
    </div>
  `;
  showPage('endingPage');
}

// ========== 结局图鉴 ==========
async function showGallery() {
  showPage('galleryPage');
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '<div class="text-center text-text-dim p-10">加载中...</div>';

  const [allRes, myRes] = await Promise.all([
    api('/api/endings'),
    api('/api/endings/my')
  ]);
  const unlockedIds = new Set((myRes.endings || []).map(e => e.id));
  const all = allRes.endings || [];

  grid.innerHTML = all.map(e => `
    <div class="gallery-item ${unlockedIds.has(e.id) ? 'unlocked' : 'locked'}">
      <h4>${unlockedIds.has(e.id) ? e.title : '???'}</h4>
      <div class="gtype" style="color:${e.color || '#888'}">${e.character_name || ''} · ${e.type || ''}</div>
      <div class="gtype">${unlockedIds.has(e.id) ? e.description || '' : '尚未解锁'}</div>
    </div>
  `).join('');

  if (all.length === 0) grid.innerHTML = '<div class="text-center text-text-dimmer p-[60px] col-span-full">暂无结局数据，请等待管理员添加</div>';
}

function returnToLobby() {
  hideChoices();
  clearInterval(gameState.timerInterval);
  if (gameState._choiceDelayId) { clearTimeout(gameState._choiceDelayId); gameState._choiceDelayId = null; }
  document.getElementById('gameVideo').pause();
  showPage('lobbyPage');
}

// ========== 键盘操作 ==========
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('saveLoadPage').classList.contains('active')) showPage('gamePage');
    else if (document.getElementById('gamePage').classList.contains('active')) returnToLobby();
    else if (document.getElementById('galleryPage').classList.contains('active')) returnToLobby();
    else if (document.getElementById('endingPage').classList.contains('active')) returnToLobby();
  }
  // 1-9 快速选择
  if (document.getElementById('gamePage').classList.contains('active') && document.getElementById('choiceOverlay').classList.contains('active')) {
    const n = parseInt(e.key);
    if (n >= 1 && n <= 9) {
      const btns = document.querySelectorAll('.choice-btn');
      if (btns[n - 1]) btns[n - 1].click();
    }
  }
});

// ========== 初始化 ==========
if (token) {
  api('/api/auth/me').then(res => {
    if (res.user) {
      user = res.user;
      document.getElementById('lobbyUser').textContent = user.nickname || user.username;
      showPage('lobbyPage');
    }
  }).catch(() => {
    localStorage.removeItem('plot_game_token');
  });
}
</script>
