<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心动时刻 - 全动态真人互动影像游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@font-face{font-family:'Game';src:local('Microsoft YaHei'),local('PingFang SC'),local('sans-serif')}
body{font-family:'Game',sans-serif;background:#000;color:#fff;overflow:hidden;user-select:none;height:100vh;width:100vw}

/* ===== 登录/大厅页面 ===== */
.page{display:none;width:100%;height:100%;position:absolute;top:0;left:0}
.page.active{display:flex}

/* 登录页 */
#loginPage{flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a0a2e 0%,#0a0a14 70%);}
.login-container{background:rgba(20,10,40,0.9);border:1px solid #3a2060;border-radius:20px;padding:48px 40px;width:420px;text-align:center;backdrop-filter:blur(10px)}
.login-container h1{font-size:32px;margin-bottom:4px;background:linear-gradient(135deg,#ff6b9d,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-container .sub{color:#888;font-size:13px;margin-bottom:28px}
.login-container .field{margin-bottom:16px;text-align:left}
.login-container label{display:block;font-size:13px;color:#aaa;margin-bottom:5px}
.login-container input{width:100%;padding:12px 16px;background:rgba(0,0,0,0.5);border:1px solid #2a2a4a;border-radius:10px;color:#fff;font-size:14px;outline:none;transition:border .2s}
.login-container input:focus{border-color:#7c3aed}
.login-container .btn{width:100%;padding:12px;background:linear-gradient(135deg,#7c3aed,#e040fb);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;margin-top:12px;transition:all .2s}
.login-container .btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(124,58,237,0.4)}
.login-container .btn.sec{background:rgba(255,255,255,0.1);margin-top:8px}
.login-container .err{color:#ef4444;font-size:13px;margin-top:8px;min-height:20px}
.login-container .switch{color:#888;font-size:13px;margin-top:16px;cursor:pointer}
.login-container .switch span{color:#7c3aed}

/* 大厅页 */
#lobbyPage{flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a0a14 0%,#1a0a2e 40%,#0a1a2e 100%);}
.lobby-bg{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.08;background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><radialGradient id="g"><stop offset="0" stop-color="%23fff"/><stop offset="1" stop-color="%23000"/></radialGradient></defs><circle cx="400" cy="300" r="300" fill="url(%23g)" opacity="0.3"/></svg>') center/cover}
.lobby-content{position:relative;z-index:1;text-align:center}
.lobby-content h1{font-size:48px;margin-bottom:8px;background:linear-gradient(135deg,#ff6b9d,#7c3aed,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.lobby-content .ver{font-size:12px;color:#555;margin-bottom:40px}
.menu-btns{display:flex;flex-direction:column;gap:14px;width:280px;margin:0 auto}
.menu-btn{padding:14px 0;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#ccc;font-size:16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.menu-btn:hover{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.4);color:#fff;transform:scale(1.03)}
.menu-btn .icon{margin-right:8px}
.user-bar{position:absolute;top:20px;right:24px;display:flex;align-items:center;gap:10px;color:#888;font-size:13px;z-index:2}
.user-bar .logout{cursor:pointer;color:#555;transition:color .2s}
.user-bar .logout:hover{color:#ef4444}

/* ===== 游戏播放器页面 ===== */
#gamePage{flex-direction:column;background:#000;position:relative}
#gameVideo{width:100%;height:100%;object-fit:contain;background:#000;position:relative;z-index:0}

/* 选择覆盖层 */
.skip-btn{position:absolute;bottom:100px;right:24px;z-index:90;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#ccc;padding:8px 20px;border-radius:20px;font-size:14px;cursor:pointer;display:none;transition:all .2s}
.skip-btn.show{display:block}
.skip-btn:hover{background:rgba(255,255,255,0.2);color:#fff}
.choice-overlay{position:absolute;bottom:0;left:0;right:0;padding:30px 40px 50px;background:linear-gradient(transparent,rgba(0,0,0,0.85) 40%);display:none;z-index:100}
.choice-overlay.active{display:block}
.choice-timer{text-align:center;margin-bottom:16px}
.choice-timer .timer-bar{height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;width:300px;margin:0 auto}
.choice-timer .timer-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#e040fb);transition:width .1s linear;width:100%}
.choice-timer .timer-text{color:#888;font-size:12px;margin-top:6px}
.choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.choice-btn{flex:1;min-width:160px;max-width:280px;padding:16px 24px;background:rgba(20,10,40,0.85);border:1px solid rgba(124,58,237,0.3);border-radius:14px;color:#ddd;font-size:15px;cursor:pointer;transition:all .25s;text-align:center;backdrop-filter:blur(8px);position:relative;overflow:hidden}
.choice-btn:hover{background:rgba(124,58,237,0.25);border-color:#7c3aed;color:#fff;transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,0.25)}
.choice-btn .hint{font-size:11px;color:#888;margin-top:6px;display:flex;gap:6px;justify-content:center}

/* 好感度面板 */
.aff-panel{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5;opacity:0;transition:opacity .5s}
.aff-panel.show{opacity:1}
.aff-item{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.6);padding:6px 10px;border-radius:20px;border:1px solid rgba(255,255,255,0.08)}
.aff-dot{width:8px;height:8px;border-radius:50%}
.aff-name{font-size:11px;color:#aaa;width:40px;text-align:right}
.aff-bar-wrap{width:80px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden}
.aff-bar{height:100%;border-radius:2px;transition:width .5s ease;width:50%}
.aff-val{font-size:10px;color:#666;width:24px}

/* 好感度变化动画 */
.aff-change{position:fixed;font-size:20px;font-weight:bold;pointer-events:none;z-index:20;animation:affFloat 1.5s ease-out forwards}
@keyframes affFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.aff-change.up{color:#ec4899;text-shadow:0 0 10px rgba(236,72,153,0.5)}
.aff-change.down{color:#06b6d4;text-shadow:0 0 10px rgba(6,182,212,0.5)}

/* 场景标题 */
.scene-title{position:absolute;top:20px;left:24px;z-index:5;font-size:14px;color:rgba(255,255,255,0.5);text-shadow:0 2px 10px rgba(0,0,0,0.8)}

/* 暂停菜单 */
.pause-menu{position:absolute;top:10px;left:10px;z-index:15}
.pause-btn{background:rgba(0,0,0,0.5);border:none;color:#fff;font-size:20px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.pause-btn:hover{background:rgba(0,0,0,0.8)}
.pause-dropdown{display:none;position:absolute;top:44px;left:0;background:rgba(20,10,40,0.95);border:1px solid #3a2060;border-radius:12px;padding:8px;min-width:160px}
.pause-dropdown.show{display:block}
.pause-dropdown button{display:block;width:100%;padding:10px 16px;background:none;border:none;color:#ccc;text-align:left;font-size:14px;cursor:pointer;border-radius:8px;transition:background .2s}
.pause-dropdown button:hover{background:rgba(124,58,237,0.2);color:#fff}

/* ===== 存档页面 ===== */
#saveLoadPage{flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.92);z-index:30}
.save-panel{background:rgba(20,10,40,0.95);border:1px solid #3a2060;border-radius:20px;padding:32px;width:560px;max-width:90vw}
.save-panel h2{text-align:center;margin-bottom:20px;font-size:22px}
.save-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.save-slot{background:rgba(0,0,0,0.4);border:1px solid #2a2a4a;border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center}
.save-slot:hover{border-color:#7c3aed}
.save-slot .slot-num{font-size:11px;color:#666}
.save-slot .slot-title{font-size:13px;color:#ccc;margin-top:4px}
.save-slot .slot-time{font-size:10px;color:#555}
.save-slot.empty{color:#444;font-size:13px}
.save-panel .actions{display:flex;gap:10px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border:none;border-radius:10px;font-size:14px;cursor:pointer;transition:all .2s}
.btn-purple{background:#7c3aed;color:#fff}
.btn-purple:hover{background:#6d28d9}
.btn-outline{background:transparent;border:1px solid #2a2a4a;color:#aaa}
.btn-outline:hover{color:#fff;border-color:#7c3aed}

/* 结局画面 */
#endingPage{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a0a2e 0%,#0a0a14 70%);flex-direction:column;z-index:30}
.ending-card{text-align:center;max-width:500px}
.ending-card .type{font-size:13px;letter-spacing:4px;margin-bottom:8px}
.ending-card h2{font-size:36px;margin-bottom:12px}
.ending-card .desc{color:#888;font-size:15px;margin-bottom:30px;line-height:1.6}
.ending-card .type.perfect{color:#ffd700}
.ending-card .type.good{color:#7c3aed}
.ending-card .type.normal{color:#888}
.ending-card .type.bad{color:#666}

/* 图鉴 */
#galleryPage{flex-direction:column;align-items:center;background:rgba(0,0,0,0.92);overflow-y:auto;padding:40px 20px;z-index:20}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:900px;width:100%}
.gallery-item{background:rgba(20,10,40,0.8);border:1px solid #2a2a4a;border-radius:14px;padding:20px;text-align:center;transition:all .2s}
.gallery-item.unlocked{border-color:#7c3aed}
.gallery-item.locked{opacity:0.3}
.gallery-item h4{font-size:15px;margin-bottom:4px}
.gallery-item .gtype{font-size:11px;color:#888}
.gallery-back{position:fixed;top:20px;left:24px;color:#888;cursor:pointer;font-size:14px;z-index:21}

/* Toast */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(124,58,237,0.9);border-radius:20px;font-size:14px;z-index:100;animation:toastIn .3s ease,toastOut .3s ease 2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div id="loginPage" class="page active">
  <div class="login-container">
    <h1>心动时刻</h1>
    <div class="sub">全动态真人互动影像游戏</div>
    <div class="field"><label>用户名</label><input id="loginUser" placeholder="请输入用户名"></div>
    <div class="field"><label>密码</label><input id="loginPass" type="password" placeholder="请输入密码"></div>
    <div class="field" id="nicknameField" style="display:none"><label>昵称</label><input id="loginNick" placeholder="请输入昵称"></div>
    <div id="loginErr" class="err"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
    <button class="btn sec" id="registerBtn" onclick="doRegister()" style="display:none">注 册</button>
    <div class="switch">还没有账号？<span id="switchBtn" onclick="toggleAuth()">立即注册</span></div>
  </div>
</div>

<!-- ==================== 大厅页 ==================== -->
<div id="lobbyPage" class="page">
  <div class="lobby-bg"></div>
  <div class="user-bar"><span id="lobbyUser"></span><span class="logout" onclick="logout()">退出</span></div>
  <div class="lobby-content">
    <h1>心动时刻</h1>
    <div class="ver">Heartbeat Moments v1.0</div>
    <div class="menu-btns">
      <button class="menu-btn" onclick="startNewGame()"><span class="icon">▶</span> 开始新游戏</button>
      <button class="menu-btn" onclick="showSaveLoad('load')"><span class="icon">📂</span> 继续游戏</button>
      <button class="menu-btn" onclick="showGallery()"><span class="icon">🏆</span> 结局图鉴</button>
      <button class="menu-btn" onclick="logout()"><span class="icon">🚪</span> 退出登录</button>
    </div>
  </div>
</div>

<!-- ==================== 游戏播放器 ==================== -->
<div id="gamePage" class="page">
  <video id="gameVideo" playsinline preload="auto"></video>
  <div class="scene-title" id="sceneTitle"></div>
  <div class="pause-menu">
    <button class="pause-btn" onclick="togglePause()">⏸</button>
    <div class="pause-dropdown" id="pauseDropdown">
      <button onclick="showSaveLoad('save')">💾 存档</button>
      <button onclick="showSaveLoad('load')">📂 读档</button>
      <button onclick="returnToLobby()">🏠 返回大厅</button>
    </div>
  </div>
  <div class="choice-overlay" id="choiceOverlay">
    <div class="choice-timer" id="choiceTimer">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <div class="timer-text" id="timerText"></div>
    </div>
    <div class="choices" id="choicesContainer"></div>
  </div>
  <div class="aff-panel" id="affPanel"></div>
  <button class="skip-btn" id="skipBtn" onclick="skipToChoices()">跳过 ⏭</button>
</div>

<!-- ==================== 存档面板 ==================== -->
<div id="saveLoadPage" class="page">
  <div class="save-panel" id="savePanel"></div>
</div>

<!-- ==================== 结局页 ==================== -->
<div id="endingPage" class="page"></div>

<!-- ==================== 图鉴页 ==================== -->
<div id="galleryPage" class="page">
  <div class="gallery-back" onclick="returnToLobby()">← 返回大厅</div>
  <h2 style="margin-bottom:24px">结局图鉴</h2>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<script>
// ========== 全局状态 ==========
const API = '';
let token = localStorage.getItem('plot_game_token');
let user = null;
let gameState = {
  currentScene: null,
  currentVideo: null,
  affections: {},
  characters: [],
  choiceTimer: null,
  timerInterval: null,
  isEnding: false
};

// ========== 工具函数 ==========
function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(API + path, { ...opts, headers: { ...headers, ...opts.headers } })
    .then(r => r.json());
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ========== 页面切换 ==========
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById(id);
  if (page) page.classList.add('active');
  // 暂停视频
  const v = document.getElementById('gameVideo');
  if (id !== 'gamePage' && v) v.pause();
}

// ========== 登录/注册 ==========
let isRegister = false;
function toggleAuth() {
  isRegister = !isRegister;
  document.getElementById('nicknameField').style.display = isRegister ? 'block' : 'none';
  document.getElementById('loginBtn').style.display = isRegister ? 'none' : 'block';
  document.getElementById('registerBtn').style.display = isRegister ? 'block' : 'none';
  document.getElementById('switchBtn').textContent = isRegister ? '返回登录' : '立即注册';
  document.getElementById('loginErr').textContent = '';
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (!u || !p) return document.getElementById('loginErr').textContent = '请输入用户名和密码';
  const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username: u, password: p }) });
  if (res.error) return document.getElementById('loginErr').textContent = res.error;
  token = res.token; user = res.user;
  localStorage.setItem('plot_game_token', token);
  document.getElementById('lobbyUser').textContent = user.nickname || user.username;
  showPage('lobbyPage');
}

async function doRegister() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const n = document.getElementById('loginNick').value.trim();
  if (!u || !p) return document.getElementById('loginErr').textContent = '请输入用户名和密码';
  if (p.length < 6) return document.getElementById('loginErr').textContent = '密码至少6位';
  const res = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ username: u, password: p, nickname: n || u }) });
  if (res.error) return document.getElementById('loginErr').textContent = res.error;
  token = res.token; user = res.user;
  localStorage.setItem('plot_game_token', token);
  document.getElementById('lobbyUser').textContent = user.nickname || user.username;
  showPage('lobbyPage');
}

function logout() {
  token = null; user = null; gameState = {};
  localStorage.removeItem('plot_game_token');
  showPage('loginPage');
  document.getElementById('loginErr').textContent = '';
  const v = document.getElementById('gameVideo'); v.pause(); v.src = '';
}

// ========== 新游戏 ==========
async function startNewGame() {
  const res = await api('/api/play/start');
  if (res.error) return toast(res.error);
  gameState.affections = {};
  loadScene(res.scene);
}

async function loadScene(scene) {
  // 清除上一个场景的定时器
  if (gameState._choiceDelayId) { clearTimeout(gameState._choiceDelayId); gameState._choiceDelayId = null; }
  hideChoices();
  clearInterval(gameState.timerInterval);

  gameState.currentScene = scene;
  gameState.isEnding = scene.is_ending && scene.ending;
  if (scene.characters) gameState.characters = scene.characters;

  showPage('gamePage');
  document.getElementById('sceneTitle').textContent = scene.chapter ? scene.chapter + ' - ' + scene.title : scene.title;

  // 播放视频
  const v = document.getElementById('gameVideo');
  v.currentTime = 0;
  v.src = '/' + (scene.file_path || '').replace(/\\/g, '/');
  v.load();
  v.play().catch(e => console.log('自动播放:', e));

  // 好感度面板
  renderAffectionPanel();

  // 根据 choice_delay 决定何时弹出选项
  const delay = scene.choice_delay || 0; // 秒
  const hasChoices = scene.choices && scene.choices.length > 0;

  if (hasChoices) {
    if (delay > 0) {
      // 显示跳过按钮
      document.getElementById('skipBtn').classList.add('show');
      // 延迟弹出：视频播到第N秒时暂停并显示选项
      gameState._choiceDelayId = setTimeout(() => {
        document.getElementById('skipBtn').classList.remove('show');
        v.pause();
        renderChoices(scene.choices, (scene.choice_timer == null || scene.choice_timer === 0) ? 0 : (scene.choice_timer || 10));
      }, delay * 1000);
    } else {
      document.getElementById('skipBtn').classList.remove('show');
      // 等视频播完再显示选项
      v.onended = () => {
        if (!gameState.isEnding) {
          renderChoices(scene.choices, (scene.choice_timer == null || scene.choice_timer === 0) ? 0 : (scene.choice_timer || 10));
        }
      };
    }
  } else {
    hideChoices();
    document.getElementById('skipBtn').classList.remove('show');
  }

  // 结局处理
  if (gameState.isEnding) {
    setTimeout(() => showEnding(scene.ending), 2000);
  }
}

// ========== 选择系统 ==========
function skipToChoices() {
  if (gameState._choiceDelayId) {
    clearTimeout(gameState._choiceDelayId);
    gameState._choiceDelayId = null;
  }
  document.getElementById('skipBtn').classList.remove('show');
  const v = document.getElementById('gameVideo');
  v.pause();
  const scene = gameState.currentScene;
  if (scene && scene.choices) {
    renderChoices(scene.choices, (scene.choice_timer == null || scene.choice_timer === 0) ? 0 : (scene.choice_timer || 10));
  }
}

function renderChoices(choices, defaultTimer) {
  const overlay = document.getElementById('choiceOverlay');
  const container = document.getElementById('choicesContainer');
  container.innerHTML = '';

  const useTimer = defaultTimer > 0;
  if (useTimer) {
    document.getElementById('choiceTimer').style.display = 'block';
    document.getElementById('timerFill').style.width = '100%';
    document.getElementById('timerText').textContent = defaultTimer + 's';
    startChoiceTimer(defaultTimer);
  } else {
    document.getElementById('choiceTimer').style.display = 'none';
  }

  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    if (c.affection_hint && c.affection_hint.length > 0) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      c.affection_hint.forEach(h => {
        const dot = document.createElement('span');
        dot.textContent = h.direction === 'up' ? '❤️' : h.direction === 'down' ? '💔' : '';
        hint.appendChild(dot);
      });
      btn.appendChild(hint);
    }
    btn.onclick = () => makeChoice(c.id);
    container.appendChild(btn);
  });

  overlay.classList.add('active');
}

function hideChoices() {
  document.getElementById('choiceOverlay').classList.remove('active');
  clearInterval(gameState.timerInterval);
}

function startChoiceTimer(seconds) {
  clearInterval(gameState.timerInterval);
  let remaining = seconds;
  gameState.timerInterval = setInterval(() => {
    remaining -= 0.1;
    const pct = Math.max(0, (remaining / seconds) * 100);
    document.getElementById('timerFill').style.width = pct + '%';
    document.getElementById('timerText').textContent = Math.ceil(remaining) + 's';
    if (remaining <= 0) {
      clearInterval(gameState.timerInterval);
      // 自动选第一个
      const firstBtn = document.querySelector('.choice-btn');
      if (firstBtn) firstBtn.click();
    }
  }, 100);
}

async function makeChoice(choiceId) {
  hideChoices();
  clearInterval(gameState.timerInterval);
  if (gameState._choiceDelayId) { clearTimeout(gameState._choiceDelayId); gameState._choiceDelayId = null; }

  const res = await api('/api/play/choose', {
    method: 'POST',
    body: JSON.stringify({ choice_id: choiceId, scene_id: gameState.currentScene.id, affections: gameState.affections })
  });
  if (res.error) return toast(res.error);

  // 好感度变化动画
  gameState.affections = res.affections || {};
  if (res.affection_changes) {
    res.affection_changes.forEach(ch => {
      showAffectionChange(ch);
    });
  }

  // 跳转到下一场景
  if (res.next_scene_id) {
    const sceneRes = await api('/api/play/scene/' + res.next_scene_id + '?affections=' + encodeURIComponent(JSON.stringify(gameState.affections)));
    if (sceneRes.scene) loadScene(sceneRes.scene);
    else toast('场景加载失败');
  } else {
    // 没有下一场景 = 结局
    toast('故事完结');
    setTimeout(() => returnToLobby(), 3000);
  }
}

function showAffectionChange(change) {
  const el = document.createElement('div');
  el.className = 'aff-change ' + (change.delta > 0 ? 'up' : 'down');
  el.textContent = (change.delta > 0 ? '+' : '') + change.delta + ' ' + change.character_name;
  el.style.left = (40 + Math.random() * 40) + '%';
  el.style.top = (30 + Math.random() * 20) + '%';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1600);
}

// ========== 好感度面板 ==========
function renderAffectionPanel() {
  const panel = document.getElementById('affPanel');
  panel.innerHTML = '';
  if (!gameState.characters) return;

  gameState.characters.forEach(c => {
    const val = gameState.affections[c.id] || 0;
    const pct = Math.min(100, Math.max(0, 50 + val * 0.5));
    const item = document.createElement('div');
    item.className = 'aff-item';
    item.innerHTML = `
      <div class="aff-dot" style="background:${c.color}"></div>
      <span class="aff-name">${c.name}</span>
      <div class="aff-bar-wrap"><div class="aff-bar" style="width:${pct}%;background:${c.color}"></div></div>
      <span class="aff-val">${val > 0 ? '+' + val : val}</span>
    `;
    panel.appendChild(item);
  });
  panel.classList.add('show');
}

// ========== 暂停菜单 ==========
function togglePause() {
  document.getElementById('pauseDropdown').classList.toggle('show');
}

// ========== 存档/读档 ==========
let saveMode = 'save';
let saveCallback = null;

async function showSaveLoad(mode) {
  saveMode = mode;
  const panel = document.getElementById('savePanel');
  const res = await api('/api/saves');
  const saves = res.saves || [];

  let html = '<h2>' + (mode === 'save' ? '💾 保存游戏' : '📂 读取存档') + '</h2><div class="save-slots">';
  for (let i = 1; i <= 9; i++) {
    const s = saves.find(sv => sv.slot === i);
    html += `<div class="save-slot ${s ? '' : 'empty'}" data-slot="${i}" onclick="${mode === 'save' ? 'doSave('+i+')' : (s ? 'doLoad('+s.id+')' : '')}">
      <div class="slot-num">存档位 ${i}</div>
      ${s ? `<div class="slot-title">${s.title}</div><div class="slot-time">${s.scene_title||''} · ${new Date(s.updated_at).toLocaleString()}</div>` : '<span>空</span>'}
    </div>`;
  }
  html += '</div><div class="actions"><button class="btn btn-outline" onclick="showPage(\'gamePage\')">返回</button></div>';
  panel.innerHTML = html;
  showPage('saveLoadPage');
}

async function doSave(slot) {
  if (!gameState.currentScene) return toast('没有进行中的游戏');
  const res = await api('/api/saves', {
    method: 'POST',
    body: JSON.stringify({
      slot,
      scene_id: gameState.currentScene.id,
      title: gameState.currentScene.title,
      play_time: 0,
      affections: gameState.affections
    })
  });
  if (res.error) return toast(res.error);
  toast('存档成功！');
  showPage('gamePage');
}

async function doLoad(saveId) {
  const res = await api('/api/saves/' + saveId + '/load');
  if (res.error) return toast(res.error);
  const save = res.save;

  // 恢复好感度
  gameState.affections = {};
  if (save.affections) {
    save.affections.forEach(a => { gameState.affections[a.character_id] = a.value; });
  }

  // 加载场景
  const sceneRes = await api('/api/play/scene/' + save.scene_id + '?affections=' + encodeURIComponent(JSON.stringify(gameState.affections)));
  if (sceneRes.scene) {
    loadScene(sceneRes.scene);
    toast('读档成功！');
  } else {
    toast('场景加载失败');
  }
}

// ========== 结局画面 ==========
function showEnding(ending) {
  const page = document.getElementById('endingPage');
  page.innerHTML = `
    <div class="ending-card">
      <div class="type ${ending.type}">${ending.type === 'perfect' ? '★ PERFECT ENDING' : ending.type === 'good' ? 'GOOD ENDING' : ending.type === 'bad' ? 'BAD ENDING' : 'ENDING'}</div>
      <h2>${ending.title}</h2>
      <div class="desc">${ending.description || ''}</div>
      <button class="btn btn-purple" onclick="returnToLobby()">返回大厅</button>
    </div>
  `;
  showPage('endingPage');
}

// ========== 结局图鉴 ==========
async function showGallery() {
  showPage('galleryPage');
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '<div style="text-align:center;color:#888;padding:40px">加载中...</div>';

  const [allRes, myRes] = await Promise.all([
    api('/api/endings'),
    api('/api/endings/my')
  ]);
  const unlockedIds = new Set((myRes.endings || []).map(e => e.id));
  const all = allRes.endings || [];

  grid.innerHTML = all.map(e => `
    <div class="gallery-item ${unlockedIds.has(e.id) ? 'unlocked' : 'locked'}">
      <h4>${unlockedIds.has(e.id) ? e.title : '???'}</h4>
      <div class="gtype" style="color:${e.color || '#888'}">${e.character_name || ''} · ${e.type || ''}</div>
      <div class="gtype">${unlockedIds.has(e.id) ? e.description || '' : '尚未解锁'}</div>
    </div>
  `).join('');

  if (all.length === 0) grid.innerHTML = '<div style="text-align:center;color:#666;padding:60px;grid-column:1/-1">暂无结局数据，请等待管理员添加</div>';
}

function returnToLobby() {
  hideChoices();
  clearInterval(gameState.timerInterval);
  if (gameState._choiceDelayId) { clearTimeout(gameState._choiceDelayId); gameState._choiceDelayId = null; }
  document.getElementById('gameVideo').pause();
  showPage('lobbyPage');
}

// ========== 键盘操作 ==========
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('saveLoadPage').classList.contains('active')) showPage('gamePage');
    else if (document.getElementById('gamePage').classList.contains('active')) returnToLobby();
    else if (document.getElementById('galleryPage').classList.contains('active')) returnToLobby();
    else if (document.getElementById('endingPage').classList.contains('active')) returnToLobby();
  }
  // 1-9 快速选择
  if (document.getElementById('gamePage').classList.contains('active') && document.getElementById('choiceOverlay').classList.contains('active')) {
    const n = parseInt(e.key);
    if (n >= 1 && n <= 9) {
      const btns = document.querySelectorAll('.choice-btn');
      if (btns[n - 1]) btns[n - 1].click();
    }
  }
});

// ========== 初始化 ==========
if (token) {
  api('/api/auth/me').then(res => {
    if (res.user) {
      user = res.user;
      document.getElementById('lobbyUser').textContent = user.nickname || user.username;
      showPage('lobbyPage');
    }
  }).catch(() => {
    localStorage.removeItem('plot_game_token');
  });
}
</script>
